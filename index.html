
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Word Wand 7‑Row POV</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main>
    <section id="welcome" class="screen">
        <div class="left">

            <h1 class="title">Word Wand 7‑Row POV</h1>
            <p class="subtitle">Uppercase • Arduino Spacing • Time‑Based Sweep</p>

            <div class="controls">

                <input id="textInput" class="textLarge" maxlength="24" placeholder="TYPE TEXT HERE" />

                <label class="chip">Color
                    <select id="colorSelect">
                        <option value="#ffffff">White</option>
                        <option value="#ff0000">Red</option>
                        <option value="#00ff00">Green</option>
                        <option value="#00ffff">Cyan</option>
                        <option value="disco">Disco 🌈</option>
                    </select>
                </label>

                <label id="discoSpeedWrap" class="chip" style="display:none;">
                    Disco speed
                    <input id="discoSpeed" type="range" min="0.2" max="5" step="0.1" value="1.8" />
                    <span id="discoSpeedVal" class="mono">1.8×</span>
                </label>

                <label class="chip">Column timing (ms)
                    <input id="colTiming" type="range" min="2" max="30" step="1" value="10" />
                    <span id="colTimingVal" class="mono">10 ms</span>
                </label>

                <button id="goBtn" class="cta" disabled>Go</button>
                <button id="stopBtn" class="stopBtn" style="display:none;">Stop</button>

                <div class="rowBtns">
                    <button id="helpBtn" class="chip small">Help</button>
                    <button id="resetBtn" class="chip small">Reset</button>
                </div>

            </div>
        </div>
    </section>

    <canvas id="wand"></canvas>

    <dialog id="helpDialog">
        <h3>Help</h3>
        <p>Swipe the phone left↔right in a dark room.<br />Use the timing slider to sharpen POV clarity.</p>
        <button id="closeHelp">Close</button>
    </dialog>
</main>

<script src="app.js"></script>
</body>
</html>
